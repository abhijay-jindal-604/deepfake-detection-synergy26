base: ../p2/p2_final.yaml
description: "P3 final: ConvNeXt-S in22k-ft-1k, lr_backbone 5e-5 (step 1: 1e-4 sel 0.8779 vs 5e-5 0.8763, within 0.01 -> lower), LLRD 0.93"
model: {name: convnext_small.fb_in22k_ft_in1k, drop_path_rate: 0.2}
train: {batch_size: 48}
# layer_decay: timm's fine-grained ConvNeXt-S grouping spans 37 decay steps from stem to top (38 backbone
# layers), so 0.8 would put the stem at 0.8^37 ~ 3e-4 x lr (frozen). Published recipes use 0.8 over ~12
# groups; d = 0.8^(12/37) = 0.930 keeps that stem/top ratio (0.93^37 ~ 0.068 ~ 0.8^12).
optim: {lr_backbone: 5.0e-5, layer_decay: 0.93}
